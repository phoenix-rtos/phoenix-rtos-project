# kernel + initrd
magic: '{{ env.MAGIC_USER_SCRIPT }}'
size: 0x1000
is_relative: True

contents:
  - wait 2000
  - kernel {{ env.BOOT_DEVICE }}
  - sched 3 1:10000;2:10000;3:10000
  - part critical ddr 1 0 -ic
  - part user ddr 2 0x2000000
  - part net ddr 3 0x2000000 -ic
  - app {{ env.BOOT_DEVICE }} -x dummyfs ddr ddr critical
  - app {{ env.BOOT_DEVICE }} -x imx6ull-uart ddr ddr critical
  - app {{ env.BOOT_DEVICE }} -x psh ddr ddr critical
  - app {{ env.BOOT_DEVICE }} -x dummyfs;-N;devfs;-D ddr ddr net
  - name: app
    device: '{{ env.BOOT_DEVICE }}'
    flags: EXEC
    filename: imx6ull-flashnor
    args:
       - '-q;1'
       - '-r;0;{{ nvm.flash0.rootfs.offs }};{{ nvm.flash0.rootfs.size }};jffs2'
    text_map: ddr
    data_maps: ddr
    partition: net
  - app {{ env.BOOT_DEVICE }} -x psh;-i;/etc/rc.psh ddr ddr net
  - app {{ env.BOOT_DEVICE }} -x dummyfs ddr ddr user
  - go!
