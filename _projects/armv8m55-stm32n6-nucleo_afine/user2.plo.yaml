# kernel + initrd
magic: '{{ env.MAGIC_USER_SCRIPT }}'
size: 0x800
is_relative: True

contents:
  # Example of app being loaded from a second Flash partition
  - app flash0 hello axi_app axi_app
  # Example of blob command
  - blob flash0 /somefile.txt axi_app
  # Example of app being loaded over RTT
  # `wait` needs to be added because the host will take some time to connect over RTT and phoenixd
  - wait 2000
  - app rtt hellocpp axi_app axi_app
