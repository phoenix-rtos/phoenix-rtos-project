# kernel + initrd
magic: '{{ env.MAGIC_USER_SCRIPT }}'
size: 0x800
is_relative: True

contents:
  - kernel {{ env.BOOT_DEVICE }}
  - app {{ env.BOOT_DEVICE }} -xn psh axi_app axi_app
  - app {{ env.BOOT_DEVICE }} -xn stm32l4-multi axi_app axi_app;per;dmamem;flash0
  - action: call
    absolute: True
    device: '{{ env.BOOT_DEVICE }}'
    filename: user2.plo
    offset: '{{ nvm[env.BOOT_DEVICE].user2.offs }}'
    target_magic: '{{ env.MAGIC_USER_SCRIPT }}'
  - wait 500
  - go!
