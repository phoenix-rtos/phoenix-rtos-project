# vim:sw=2:ts=2
# action name
name: 'phoenix-runner'

# action description
description: 'Runs Phoenix-RTOS tests'

inputs:
  image-tag:
    description: 'Docker image tag version'
    default: 'latest'
    required: false
  target:
    description: 'Specifies target to run tests'
    default: 'ia32-generic-qemu'
    required: false

  nightly:
    description: 'Run nightly mode'
    default: 'false'
    required: false

  test-paths:
    description: 'Space separated directories to search for tests. By default the whole project is searched'
    default: ''
    required: false

  regex:
    description: 'Run only the tests matching this regex. By default all found tests are run'
    default: ''
    required: false

# we're using a composite action as `docker` action type doesn't allow non-static image specification
runs:
  using: 'composite'
  steps:
  - name: Run phoenix-build container
    shell: bash
    env:
      TEST_PATHS: ${{ inputs.test-paths }}
      TEST_REGEX: ${{ inputs.regex }}
    run: |
      IMAGE="ghcr.io/phoenix-rtos/devel:${{ inputs.image-tag }}"
      echo "Using Docker image: $IMAGE"

      # Collect all GITHUB_* env vars and format as -e KEY - omit value to avoid secret leakage
      GH_ENV_ARGS=$(env | grep ^GITHUB_ | cut -d= -f1 | sed 's/^/-e /')

      # Optional runner args - kept in an array so a regex may contain spaces
      RUNNER_ARGS=()
      if [ "${{ inputs.nightly }}" = "true" ]; then
        RUNNER_ARGS+=(--nightly)
      fi

      # restrict the campaign to a subset of tests - runner accepts -t multiple times
      for path in $TEST_PATHS; do
        RUNNER_ARGS+=(-t "$path")
      done

      if [ -n "$TEST_REGEX" ]; then
        RUNNER_ARGS+=(-r "$TEST_REGEX")
      fi

      # runner args:
      #  -v  # output SKIP subresults at a top level
      #  -Oresults.csv # creates also junit xml
      # when running docker manually - we need to reflect the host paths (no Path translation is done in the runner)
      docker run --rm --privileged \
        -v "${{ github.workspace }}:${{ github.workspace }}" \
        -w "${{ github.workspace }}" \
        -v "${HOME}:${HOME}" \
        -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
        -v "${GITHUB_ENV}:${GITHUB_ENV}" \
        -v "${GITHUB_OUTPUT}:${GITHUB_OUTPUT}" \
        -e CI=true \
        -e HOME \
        -e RUNNER_TEMP \
        -e TARGET="${{ inputs.target }}" \
        $GH_ENV_ARGS \
        --entrypoint="./phoenix-rtos-tests/runner.py" \
        "$IMAGE" \
          -v \
          -T${{ inputs.target }} \
          "${RUNNER_ARGS[@]}" \
          -Oresults.csv

# branding
branding:
  icon: terminal
  color: green
