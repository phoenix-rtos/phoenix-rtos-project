# vim:sw=2:ts=2
name: ci

on:
  push:
    branches:
      - master
      - 'feature/*'
  pull_request:
    branches:
      - master
      - 'feature/*'

jobs:
  call-ci:
    if: false
    uses: ./.github/workflows/ci-project.yml
    secrets: inherit

  call-rust:
    uses: ./.github/workflows/ci-rust.yml
