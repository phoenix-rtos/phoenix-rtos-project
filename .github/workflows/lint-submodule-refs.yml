# vim:sw=2:ts=2
# Submodule bumps must point to commits already merged into the submodule's master branch.
name: lint-submodule-refs

# on events
on:
  pull_request:
    branches:
      - master
      - 'feature/*'
  push:
    branches:
      - master
      - 'feature/*'

permissions:
  contents: read

jobs:
  submodule-refs:
    name: submodule-refs
    runs-on: ubuntu-latest
    steps:
      # full history: we need both ends of the checked range, submodules are not needed
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Check that moved submodules point to master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # for a PR these are the real branch tips (the checked out ref is the merge commit)
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci/check-submodule-refs.sh "${BASE_SHA}" "${HEAD_SHA}"
