size: 0x200
is_relative: False

contents:
  # NOTE: All data/code maps need to be cacheable to allow unaligned accesses
  # env.BOOT_DEVICE should correspond to one of the map names
  - map flash0     0x00000000 0x00080000 rxcb  # Flash bank 0
  - map flash1     0x00080000 0x00100000 rxcb  # Flash bank 1
  - map sram       0x20000000 0x20050000 rwxcb # SRAM 1:3
  - map periph     0x40000000 0x50000000 rw    # Peripherals
  - map fmc1       0x60000000 0x70000000 rw    # FMC Bank 1
  - map fmc3       0x80000000 0x90000000 rw    # FMC Bank 3
  - map octo1      0x90000000 0xa0000000 rwxcb # OCTOSPI1 bank
  - map sdram      0xc0000000 0xe0000000 rwxcb # FMC SDRAM
#  - map cpu_per    0xe0000000 0xe0100000 rw    # Cortex M33 registers
#  - phfs flash0 2.0
  - phfs ramdisk 4.0
  - console 0.4

  - if: '{{ not(env.RAM_SCRIPT) | default(false) }}'
    action: call
    set_base: True
    device: '{{ env.BOOT_DEVICE }}'
    filename: user.plo
    offset: '{{ nvm[env.BOOT_DEVICE].user.offs }}'
    target_magic: '{{ env.MAGIC_USER_SCRIPT }}'
