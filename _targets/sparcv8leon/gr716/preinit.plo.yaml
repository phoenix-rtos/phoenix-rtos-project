size: 0x1000
is_relative: False

contents:
  - map dram 0x30000000 0x30010000 rw
  - map iram 0x31000000 0x31020000 rx
  - map extram 0x40000000 0x40200000 rwxk
  - phfs uart3 0.3 phoenixd
  - phfs flash0 2.0 raw
  - console 0.2

  - if: '{{ not(env.RAM_SCRIPT) | default(false) }}'
    action: call
    set_base: True
    device: '{{ env.BOOT_DEVICE }}'
    filename: user.plo
    offset: '{{ nvm.flash0.kernel.offs }}'
    target_magic: '{{ env.MAGIC_USER_SCRIPT }}'

